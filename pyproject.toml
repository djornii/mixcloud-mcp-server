[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mixcloud-mcp-server"
dynamic = ["version"]
description = "MCP server for the Mixcloud API: search, browse, upload and edit shows"
readme = "README.md"
license = "MIT"
authors = [{ name = "djornii" }]
requires-python = ">=3.10"
keywords = ["mcp", "mixcloud", "model-context-protocol", "podcast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "mcp>=1.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/djornii/mixcloud-mcp-server"
Issues = "https://github.com/djornii/mixcloud-mcp-server/issues"
Changelog = "https://github.com/djornii/mixcloud-mcp-server/blob/main/CHANGELOG.md"

[project.scripts]
mixcloud-mcp-server = "mixcloud_mcp_server.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.hatch.version]
source = "code"
path = "src/mixcloud_mcp_server/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mixcloud_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: hits the real Mixcloud API; needs MIXCLOUD_LIVE=1 and a token",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "T20", "RUF"]
ignore = [
    "S101", # assert is how tests check things
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# The only print in the package: stdout is free until mcp.run() starts the transport.
"src/mixcloud_mcp_server/server.py" = ["T201"]