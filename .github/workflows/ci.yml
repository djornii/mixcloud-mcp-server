name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject.toml; 3.14 is what uv resolves by
        # default here. Test both ends of the supported range.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # No credentials, no network to Mixcloud: respx mocks every request and the
      # live suite is skipped without MIXCLOUD_LIVE=1.
      - name: Test
        run: uv run pytest

      - name: Build the distribution
        run: uv build